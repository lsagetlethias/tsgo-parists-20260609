packages:
  - "packages/*"

# tsgo est publié en builds `dev` quotidiens (@typescript/native-preview).
# La policy supply-chain par défaut de pnpm 11 (minimumReleaseAge) refuserait
# un paquet publié il y a quelques heures -> on la désactive ICI pour pouvoir
# tirer le tout dernier tsgo. Reproductibilité assurée par le lockfile.
minimumReleaseAge: 0
# Évite le prompt TTY quand pnpm doit recréer node_modules (changement de version).
confirmModulesPurge: false
