name: typecheck

# Pattern DOUBLE-BINAIRE — le cœur de l'argumentaire "à quel prix ?".
#
# tsgo (TS 7) type-checke ~10x plus vite : parfait comme *gate* de PR. MAIS son
# API outils (Corsa) ne couvre pas encore tout, et son emit de déclarations est
# encore en preview. Donc on NE produit PAS les .d.ts publiés avec tsgo : on
# garde tsc (Strada), source de vérité, pour ça.
#
#   - job `typecheck-fast`     : tsgo --noEmit  -> rapide, bloque le PR
#   - job `emit-declarations`  : tsc --emitDeclarationOnly -> artifact fiable
#
# Les deux tournent en parallèle : la gate reste rapide, les déclarations restent
# sûres.

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    # Toute la démo CI porte sur le petit projet contrôlé.
    working-directory: demo-project-small

jobs:
  # --- Gate rapide : type-check via le binaire natif --------------------------
  typecheck-fast:
    name: typecheck (tsgo, gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo-project-small/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # tsgo : la vérification de types qui bloque le merge si elle échoue.
      - run: pnpm typecheck:tsgo

  # --- Artifact fiable : déclarations émises par tsc (PAS tsgo) ---------------
  emit-declarations:
    name: declarations (tsc, artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo-project-small/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # tsc reste la source de vérité pour l'emit des .d.ts publiés.
      - run: pnpm build:declarations
      - uses: actions/upload-artifact@v4
        with:
          name: declarations
          path: demo-project-small/packages/*/dist/**/*.d.ts
          if-no-files-found: error
